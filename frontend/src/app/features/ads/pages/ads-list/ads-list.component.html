<div class="container mt-4">

  <h2 class="mb-4">Hirdetések</h2>
  @if (loading) {
    <p>Loading...</p>
  } @else if (ads.length === 0){
    <p>Nincs hirdetés</p>
  } @else {
    <div class="row">

      @for (ad of ads; track ad.id) {

        <div class="col-md-4 mb-4">

          <app-ad-card [ad]="ad"></app-ad-card>

        </div>

      }


    </div>
  }
</div>
