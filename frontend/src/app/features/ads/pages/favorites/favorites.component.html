<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="mb-0">
      Kedvenceim
    </h2>

  </div>

  @if (loading) {

    <p>Töltés...</p>

  } @else if (!ads.length) {

    <div class="alert alert-light border">

      Még nincs kedvenc hirdetésed.

    </div>

  } @else {

    <div class="row g-4">

      @for (ad of ads; track ad.id) {

        <div class="col-12 col-sm-6 col-lg-4">

          <app-ad-card
            [ad]="ad"
            [showFavoriteRemove]="true"
            (removeFavorite)="removeFavorite($event)">
          </app-ad-card>

        </div>

      }

    </div>

  }

</div>
