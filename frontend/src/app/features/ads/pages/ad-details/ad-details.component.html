@if (!ad){
  <p>Loading...</p>
}@else{
  <div class="details-container">

    @if(getPrimaryImage(ad)){
    <img [src]="getPrimaryImage(ad)" class="main-image">

    }

    <h1>{{ ad.title }}</h1>

    <h2>{{ ad.price}} Ft</h2>

    <p><strong>Location:</strong> {{ ad.location }}</p>

    <p class="description">
      {{ ad.description }}
    </p>

  </div>
}
