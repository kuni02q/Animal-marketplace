<div>

  <input class="form-control mb-2"
         placeholder="Username"
         [(ngModel)]="username">

  <input class="form-control mb-2"
         placeholder="Email"
         [(ngModel)]="email">

  <input class="form-control mb-2"
         type="password"
         placeholder="Password"
         [(ngModel)]="password">

  <button class="btn btn-success w-100"
          (click)="register()">
    Regisztráció
  </button>

</div>
